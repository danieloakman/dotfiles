id = "local/pass"
name = "Pass"
version = "0.1.0"
plugin_api = 3
author = "local"
license = "MIT"
deprecated = false
icon = "key"
description = "Browse password-store entries, copy fields, passwords, and OTP codes"
tags = ["launcher", "privacy", "productivity", "utility"]
dependencies = ["pass", "pass-otp", "gpg", "wl-copy", "wtype"]

[[setting]]
key = "refresh_interval"
type = "int"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = 30
min = 5
max = 3600

[[launcher_provider]]
id = "search"
entry = "launcher.luau"
prefix = "pass"
glyph = "key"

[[service]]
id = "cache"
entry = "service.luau"
