[package]
name = "agent-telegram-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
frankenstein = { version = "0.52.1", default-features = false, features = ["client-ureq"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.5"
uuid = { version = "1", features = ["v4"] }
