[package]
name = "telegram-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
env_logger = "0.11"
frankenstein = { version = "0.52.1", default-features = false, features = ["client-ureq"] }
log = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
